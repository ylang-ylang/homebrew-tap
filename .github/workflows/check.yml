# Tap checks for ylang-ylang/homebrew-tap.
#
# The release-distribution workflow in ylang-ylang/portmap opens formula
# update PRs and merges them ONLY after this check is green, so the job id
# and name MUST stay exactly "tap-checks" (the required-check name) and the
# runner MUST stay Linux (the formula targets linux-amd64 and its unit
# tests assume a POSIX toolchain).

name: tap-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tap-checks:
    name: tap-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Formula Ruby syntax
        run: |
          for formula in Formula/*.rb; do
            ruby -c "$formula"
          done

      - name: Tap unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up Homebrew for Git Guard
        if: hashFiles('Formula/git-guard.rb') != ''
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878

      - name: Install and exercise Git Guard
        if: hashFiles('Formula/git-guard.rb') != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install --build-from-source ylang-ylang/tap/git-guard
          brew test ylang-ylang/tap/git-guard
          brew reinstall --build-from-source ylang-ylang/tap/git-guard
          brew test ylang-ylang/tap/git-guard
